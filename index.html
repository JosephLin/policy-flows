<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Policy Flows</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <header class="card title">
      <h1>Policy Flows</h1>
      <p>14 policy islands, 20 flows. Pick a resource to see where it comes from and where it goes.</p>
    </header>
    <svg id="map" role="img" aria-label="Hex map of policy islands"></svg>
    <div id="tip" class="card" hidden></div>
    <nav id="bar" class="card" aria-label="Resource views"></nav>
  </main>
  <aside id="panel"></aside>
  <script type="module" src="app.js"></script>
</body>
</html>
