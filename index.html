<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Policy Flows</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="stage">
    <div id="world"></div>
    <header class="card title">
      <h1>Policy Flows</h1>
      <p>14 policy islands, 20 flows. Pick a resource to see where it comes from and where it goes. Drag to orbit, scroll to zoom.</p>
    </header>
    <div id="tip" class="card" hidden></div>
    <nav id="bar" class="card" aria-label="Resource views"></nav>
  </main>
  <aside id="panel"></aside>
  <script type="module" src="scene.js"></script>
</body>
</html>
